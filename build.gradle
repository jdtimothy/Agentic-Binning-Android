plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.0'
    id 'com.google.devtools.ksp' version '2.2.0-2.0.2'
}

android {
    namespace 'com.agentic.binning'

    compileSdk 35

    defaultConfig {
        applicationId 'com.agentic.binning'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }

    buildFeatures {
        compose true
    }

    // Room's exported schemas, also read by MigrationTestHelper in instrumented tests.
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

ksp {
    // Committed: every released schema version, so migrations can be generated and tested.
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    // GenieX Android binding (published to Maven Central).
    implementation 'com.qualcomm.qti:geniex-android:0.10.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.1'

    // Persistence
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.sqlite:sqlite-bundled:2.5.2'

    // Media
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
    implementation 'io.coil-kt.coil3:coil-video:3.2.0'
    implementation 'dev.chrisbanes.haze:haze:1.6.4'

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
