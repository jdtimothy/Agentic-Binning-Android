name: Release APK

# Push a version tag (e.g. v1.0.0) to build a signed release APK and attach
# it to a GitHub Release. Can also be run manually from the Actions tab,
# which builds the APK and uploads it as a workflow artifact instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Signing is optional: with the KEYSTORE_* secrets set, the release
      # APK comes out signed; without them the build still succeeds and
      # produces an unsigned APK (fine for pipeline testing).
      - name: Decode the release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded; this build will be signed."
          else
            echo "No KEYSTORE_BASE64 secret set; this build will be unsigned."
          fi

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/release/*.apk
